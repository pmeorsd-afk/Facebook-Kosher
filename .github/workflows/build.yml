name: Build Facebook Kosher (.deb & Tests)

# Verify the tweak compiles cleanly and passes verification on every pull
# request and push to main or facebook-kosher using build.py --no-ipa.
#
# CI ships no decrypted Facebook IPA (it cannot, for legal reasons), so build.py
# is run with --no-ipa: it builds every packaging variant (rootless, rootfull and
# roothide .deb, plus the TrollFools zip) and skips the cyan injection step.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  push:
    branches: [main, facebook-kosher]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same PR/branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak (.deb)
    # macOS so Theos uses Xcode's toolchain and iOS SDK directly — far more
    # reliable than a Linux cross-compiler + downloaded SDK.
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Kosher Python verification suite
        run: python3 test/test_kosher_verification.py

      - name: Install Theos build dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Run compiler syntax & typecheck across all targets
        run: python3 scripts/verify.py check

      - name: Compile Objective-C Kosher policy unit tests (iOS Simulator SDK)
        run: make -C test/KosherTests build-sim

      - name: Build packages
        run: python3 build.py --no-ipa

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Kosher
          path: |
            packages/Facebook-Plus-v*.deb
            packages/Facebook-Plus-v*.zip
          if-no-files-found: error
          retention-days: 30
